services:
  - type: web
    name: prompt-engine-compiler
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false # You will set this value in the Render dashboard under Environment Variables
